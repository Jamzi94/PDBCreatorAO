name: Pipeline Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify syntax
        run: python -m py_compile oriented.py pipeline.py
          
      - name: Test imports
        run: |
          python -c "from oriented import check_opm_availability, build_opm_mapping, align_structures_by_groups_v2, classify_adme_family; print('Import OK')"
          
      - name: Test OPM API
        run: |
          python -c "from oriented import check_opm_availability; r = check_opm_availability('6c0v'); print('OPM 6C0V:', r); assert r['available'], 'OPM should be available'"
          
      - name: Test ADME classification
        run: |
          python -c "from oriented import classify_adme_family; f = classify_adme_family('ABCB1'); print('ABCB1:', f); assert f == 'ABC_efflux', 'Expected ABC_efflux'"
          
      - name: Run pipeline (P08183 only)
        run: python pipeline.py --ids P08183 -v
          
      - name: Verify v2 output structure
        run: |
          ls -la pdb_structures_oriented_v2/ || echo "v2 directory not created"
          find pdb_structures_oriented_v2 -name "metadata.json" | head -5 || echo "No metadata files"
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results
          path: |
            uniprot_results.xlsx
            pipeline.log
            pdb_structures_oriented_v2/
          retention-days: 7
